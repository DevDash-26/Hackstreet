# Supabase configuration file.
# https://supabase.com/docs/guides/cli/config

project_id = "university-portal"

[db]
port = 54322
shadow_port = 54320
major_version = 15

# Local database password. Only used by `supabase start`; the hosted
# project credentials come from Vault/connection string when linked.
# [db.password]
# inline = "postgres"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/*"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false